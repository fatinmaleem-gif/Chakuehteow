<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter Dashboard</title>

<style>
body{
  font-family:Arial, sans-serif;
  margin:0;
  background:#f5f5f5;
}

header{
  background:#111;
  color:white;
  padding:15px;
  text-align:center;
  font-size:30px;
  font-weight:bold;
}

#orders{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:15px;
  padding:15px;
}

.order-card{
  background:white;
  border-radius:15px;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
  border-left:10px solid orange;
}

.order-card h2{
  margin:0 0 10px 0;
  display:flex;
  justify-content:space-between;
}

.order-items{
  margin:10px 0;
  line-height:1.5;
  background:#fdfdfd;
  padding:8px;
  border-radius:8px;
}

.order-total{
  font-size:22px;
  font-weight:bold;
  color:green;
  margin-top:10px;
}

.order-status{
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
}

.payment-status{
  margin-top:5px;
  font-size:16px;
  font-weight:bold;
  color:#2196f3;
}

.btn-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.full-width{
  grid-column: span 2;
}

button{
  border:none;
  padding:12px;
  border-radius:8px;
  color:white;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity: 0.85;
}

.pay-btn{
  background:#2196f3;
}

.prep-btn{
  background:#9c27b0;
}

.serve-btn{
  background:#4caf50;
}

.print-btn{
  background:#ff9800;
}

.close-btn{
  background:#777;
}
</style>
</head>

<body>

<header>
  🍜 COUNTER DASHBOARD
</header>

<div id="orders">Loading active kitchen requests...</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyMEFw5aCyjy2S9hcF5y9QUj1VXRaKzL6sgv7fwxAKFKbGXo5jifOITAd4WKbA62wIL/exec";

let currentOrders = [];

async function loadOrders(){
  try{
    const res = await fetch(API_URL + "?action=getOrders");
    const data = await res.json();
    const ordersDiv = document.getElementById("orders");
    ordersDiv.innerHTML = "";

    if(!data.success || !data.orders || data.orders.length === 0){
      ordersDiv.innerHTML = "<h2 style='grid-column:1/-1; text-align:center; color:#777;'>No active orders</h2>";
      return;
    }

    currentOrders = data.orders;

    // Filter out orders that have been completely archived
    const activeOrders = data.orders.filter(o => String(o.status).toLowerCase() !== "closed");

    if(activeOrders.length === 0){
      ordersDiv.innerHTML = "<h2 style='grid-column:1/-1; text-align:center; color:#777;'>All orders cleared! 🎉</h2>";
      return;
    }

    activeOrders.reverse().forEach(order=>{
      let itemsHTML = "";
      
      let parsedItems = Array.isArray(order.items) ? order.items : [];
      if(typeof order.items === 'string'){
         try { parsedItems = JSON.parse(order.items); } catch(e) { parsedItems = []; }
      }

      parsedItems.forEach(item=>{
        itemsHTML += `<div>⚡ <b>${item.qty}x</b> ${item.name}</div>`;
      });

      const isPaid = (order.paymentStatus || "").toUpperCase() === "PAID";
      
      // Dynamic boundary colors based on kitchen cooking state
      let cardBorder = "orange";
      if(order.status === "Preparing") cardBorder = "#9c27b0";
      if(order.status === "Served") cardBorder = "#4caf50";

      // Context-aware bottom button logic switcher
      let workflowButton = `<button class="prep-btn" onclick="updateStatus(${order.row}, 'Preparing')">🍳 PREPARE</button>`;
      if(order.status === "Preparing") {
        workflowButton = `<button class="serve-btn" onclick="updateStatus(${order.row}, 'Served')">🚀 SERVE</button>`;
      } else if (order.status === "Served") {
        workflowButton = `<button class="close-btn" onclick="updateStatus(${order.row}, 'Closed')">📥 CLOSE & ARCHIVE</button>`;
      }

      ordersDiv.innerHTML += `
        <div class="order-card" style="border-left:10px solid ${cardBorder}">
          <h2><span>Pager ${order.pagerNo || "-"}</span> <span style="font-size:14px; color:#666;">#${order.orderNo || ''}</span></h2>
          <div class="order-items">${itemsHTML}</div>
          <div class="order-total">RM ${Number(order.total || 0).toFixed(2)}</div>
          <div class="order-status">Status: <span style="color:${cardBorder}">${order.status || "Pending"}</span></div>
          <div class="payment-status" style="color: ${isPaid ? '#4caf50' : '#2196f3'}">
            Payment: ${order.paymentStatus || "Unpaid"}
          </div>
          
          <div class="btn-group">
            <button class="pay-btn" onclick="markPaid(${order.row})" ${isPaid ? 'disabled style="background:#ccc; cursor:default;"' : ''}>
              ${isPaid ? '✓ PAID' : '💵 PAYMENT'}
            </button>
            <button class="print-btn" onclick="printReceipt(${order.row})">🖨️ PRINT</button>
            <div class="full-width" style="display:grid; margin-top:5px;">
              ${workflowButton}
            </div>
          </div>
        </div>
      `;
    });
  }catch(error){
    console.error(error);
  }
}

// 💵 BUTTON ACTION: Update payment column to PAID
async function markPaid(row){
  try {
    const res = await fetch(API_URL + "?action=markPaid&row=" + row);
    const data = await res.json();
    if(data.success){
      loadOrders();
    } else {
      alert("Payment update failed.");
    }
  } catch (e) {
    alert("Network error.");
  }
}

// 🔄 WORKFLOW SWITCHER ACTION: Shifts Status (Pending -> Preparing -> Served -> Closed)
async function updateStatus(row, nextState){
  if(nextState === 'Closed' && !confirm("Archive this order card from the monitor screen?")) return;
  
  try {
    const res = await fetch(API_URL + "?action=markPaid&row=" + row + "&status=" + nextState + "&paymentStatus=");
    const data = await res.json();
    if(data.success){
      loadOrders();
    } else {
      alert("Failed to update kitchen status state.");
    }
  } catch (e) {
    alert("Network request timeout error.");
  }
}

// 🖨️ DIRECT RAWBT MOBILE APP REDIRECTION ACTION (FIXED FOR BASE64 RAW TEXT BUG)
function printReceipt(rowId) {
  const order = currentOrders.find(o => Number(o.row) === Number(rowId));
  if (!order) return;

  let parsedItems = Array.isArray(order.items) ? order.items : [];
  if(typeof order.items === 'string'){
     try { parsedItems = JSON.parse(order.items); } catch(e) { parsedItems = []; }
  }

  // Exact 32-character field width layout for POS-5810DD 58mm roll width
  let txt = "";
  txt += "            TAIPING\n";
  txt += "            WOK HEI\n";
  txt += "        CHAR KUEY TEOW\n";
  txt += "--------------------------------\n";
  txt += `Order No : ${order.orderNo || '-'}\n`;
  txt += `Pager No : ${order.pagerNo || '-'}\n`;
  txt += `Status   : ${order.status || 'Pending'}\n`;
  txt += "--------------------------------\n";
  
  parsedItems.forEach(item => {
    let name = item.name.substring(0, 20).padEnd(20, " ");
    let qty = ("x" + item.qty).padStart(4, " ");
    let price = "";
    if (item.price) {
      price = ("RM" + (item.price * item.qty).toFixed(2)).padStart(8, " ");
    }
    txt += `${name}${qty}${price}\n`;
  });
  
  txt += "--------------------------------\n";
  let formattedTotal = "RM " + Number(order.total || 0).toFixed(2);
  txt += `TOTAL:${formattedTotal.padStart(26, " ")}\n`;
  txt += `Payment Status: ${order.paymentStatus || 'Unpaid'}\n`;
  txt += "--------------------------------\n";
  txt += "     Thank You! Please Wait     \n";
  txt += "\n\n\n\n.\n\n"; 

  try {
    // 1. Properly translate characters into an array of UTF-8 clean bytes
    const encoder = new TextEncoder();
    const bytes = encoder.encode(txt);
    
    // 2. Convert binary byte array safely over to standard base64 structure
    let binString = "";
    for (let i = 0; i < bytes.byteLength; i++) {
      binString += String.fromCharCode(bytes[i]);
    }
    const base64Data = btoa(binString);
    
    // 3. FORCE DECODING: Use RawBT's specific URL scheme prefix instead of an intent string
    window.location.href = "rawbt://base64/" + base64Data;

  } catch (err) {
    alert("Could not interface with RawBT. Verify the app is configured on this tablet.");
  }
}

  // Initial Bootup Sequence Execution
loadOrders();
// Optional Poll Sync Loop: check for new database lines every 15 seconds automatically
setInterval(loadOrders, 15000);
</script>
</body>
</html>

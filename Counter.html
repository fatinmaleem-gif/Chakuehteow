<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter Dashboard</title>

<style>
body{
  font-family:Arial, sans-serif;
  margin:0;
  background:#f5f5f5;
}

header{
  background:#111;
  color:white;
  padding:15px;
  text-align:center;
  font-size:30px;
  font-weight:bold;
}

#orders{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
  padding:15px;
}

.order-card{
  background:white;
  border-radius:15px;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
  border-left:10px solid orange;
}

.order-card h2{
  margin:0 0 10px 0;
}

.order-items{
  margin:10px 0;
  line-height:1.5;
}

.order-total{
  font-size:22px;
  font-weight:bold;
  color:green;
  margin-top:10px;
}

.order-status{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.payment-status{
  margin-top:5px;
  font-size:18px;
  font-weight:bold;
  color:#2196f3;
}

.btn-group{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:15px;
}

button{
  border:none;
  padding:12px;
  border-radius:10px;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity: 0.85;
}

.pay-btn{
  background:#2196f3;
}

.print-btn{
  background:#ff9800;
}

.close-btn{
  background:#777;
}
</style>
</head>

<body>

<header>
  🍜 COUNTER DASHBOARD
</header>

<div id="orders">Loading active orders...</div>

<script>
// ⚠️ ENSURE THIS IS YOUR LATEST ACTIVE GOOGLE WEB APP URL
  
const API_URL =
"https://script.google.com/macros/s/AKfycbyMEFw5aCyjy2S9hcF5y9QUj1VXRaKzL6sgv7fwxAKFKbGXo5jifOITAd4WKbA62wIL/exec";

let currentOrders = [];

async function loadOrders(){
  try{
    const res = await fetch(API_URL + "?action=getOrders");
    const data = await res.json();
    const ordersDiv = document.getElementById("orders");
    ordersDiv.innerHTML = "";

    if(!data.success || !data.orders || data.orders.length === 0){
      ordersDiv.innerHTML = "<h2 style='grid-column:1/-1; text-align:center; color:#777;'>No active orders</h2>";
      return;
    }

    // Capture entire array payload into master dashboard memory space
    currentOrders = data.orders;

    // Filter cards to hide everything tagged as Closed
    const activeOrders = data.orders.filter(o => String(o.status).toLowerCase() !== "closed");

    if(activeOrders.length === 0){
      ordersDiv.innerHTML = "<h2 style='grid-column:1/-1; text-align:center; color:#777;'>No pending orders</h2>";
      return;
    }

    // Render cards layout stack
    activeOrders.reverse().forEach(order=>{
      let itemsHTML = "";
      
      let parsedItems = Array.isArray(order.items) ? order.items : [];
      if(typeof order.items === 'string'){
         try { parsedItems = JSON.parse(order.items); } catch(e) { parsedItems = []; }
      }

      parsedItems.forEach(item=>{
        itemsHTML += `<div>${item.qty}x ${item.name}</div>`;
      });

      const isPaid = (order.paymentStatus || "").toUpperCase() === "PAID";
      const cardBorder = isPaid ? "#4caf50" : "orange";

      ordersDiv.innerHTML += `
        <div class="order-card" style="border-left:10px solid ${cardBorder}">
          <h2>Pager ${order.pagerNo || "-"}</h2>
          <div>Order No: ${order.orderNo || "-"}</div>
          <div class="order-items">${itemsHTML}</div>
          <div class="order-total">RM ${Number(order.total || 0).toFixed(2)}</div>
          <div class="order-status">Status: ${order.status || "Pending"}</div>
          <div class="payment-status" style="color: ${isPaid ? '#4caf50' : '#2196f3'}">
            Payment: ${order.paymentStatus || "Unpaid"}
          </div>
          <div class="btn-group">
            <button class="pay-btn" onclick="markPaid(${order.row})" ${isPaid ? 'disabled style="background:#ccc; cursor:default;"' : ''}>
              ${isPaid ? 'PAID' : 'PAYMENT'}
            </button>
            <button class="print-btn" onclick="printReceipt(${order.row})">PRINT</button>
            <button class="close-btn" onclick="closeOrder(${order.row})">CLOSE</button>
          </div>
        </div>
      `;
    });
  }catch(error){
    document.getElementById("orders").innerHTML = "<h2 style='grid-column:1/-1; text-align:center; color:red;'>Error loading data data pipeline connection stream</h2>";
    console.error(error);
  }
}

// 💵 OPTION 1: Update payment ledger column
async function markPaid(row){
  try {
    const res = await fetch(API_URL + "?action=markPaid&row=" + row);
    const data = await res.json();

    if(data.success){
      alert("Payment updated successfully!");
      loadOrders();
    } else {
      alert("Payment update failed.");
    }
  } catch (e) {
    alert("Network verification request timeout.");
  }
}

// 🖨️ OPTION 2: Trigger thermal popup receipt print engine
function printReceipt(rowId) {
  // Use row sequence indexing structure instead of tracking hash labels
  const order = currentOrders.find(o => Number(o.row) === Number(rowId));
  if (!order) {
    alert("Error fetching matching ticket identity metadata values.");
    return;
  }

  let itemsText = "";
  let parsedItems = Array.isArray(order.items) ? order.items : [];
  if(typeof order.items === 'string'){
     try { parsedItems = JSON.parse(order.items); } catch(e) { parsedItems = []; }
  }

  parsedItems.forEach(item => {
    itemsText += `<p style="display:flex; justify-content:space-between; margin:4px 0;"><span>${item.name}</span> <span>x${item.qty}</span></p>`;
  });

  const printWindow = window.open('', '_blank', 'width=350,height=500');
  
  if (!printWindow) {
    alert("Pop-up window blocked by browser security settings! Please enable pop-ups for this site to print receipts.");
    return;
  }

  printWindow.document.write(`
    <html>
    <head>
      <title>Receipt - ${order.orderNo || 'POS'}</title>
      <style>
        body { font-family: 'Courier New', monospace; padding: 15px; text-align: center; color: #000; margin: 0; }
        .dashed-line { border-top: 1px dashed #000; margin: 10px 0; width: 100%; }
        .items-container { text-align: left; font-size: 14px; }
        h3 { margin: 5px 0; }
        p { margin: 5px 0; font-size: 14px; }
      </style>
    </head>
    <body>
      <h3>ALFA FOOD RESTAURANT</h3>
      <p>Order No: ${order.orderNo || '-'}<br>Pager Code: ${order.pagerNo || '-'}</p>
      <div class="dashed-line"></div>
      <div class="items-container">${itemsText || '<p>No items items configured</p>'}</div>
      <div class="dashed-line"></div>
      <h4 style="display:flex; justify-content:space-between; margin:5px 0;"><span>TOTAL:</span> <span>RM ${Number(order.total || 0).toFixed(2)}</span></h4>
      <p style="font-size:12px; margin-top:15px;">Payment Status: ${order.paymentStatus || 'Unpaid'}</p>
      <div style="font-size:11px; margin-top:5px;">Thank you! Please visit us again.</div>
      <script>
        // Trigger OS native printing system modal immediately upon initialization completion
        setTimeout(function(){ window.print(); window.close(); }, 500);
      <\/script>
    </body>
    </html>
  `);
  printWindow.document.close();
}

// 📥 OPTION 3: Mark system tracking field as Closed
async function closeOrder(row){
  if(!confirm("Are you sure you want to clear this card from the screen?")) return;
  
  try {
    // Append blank payment status to avoid resetting the column back to Paid or custom flags
    const res = await fetch(API_URL + "?action=markPaid&row=" + row + "&status=Closed&paymentStatus=");
    const data = await res.json();

    if(data.success){
      alert("Order successfully closed and archived!");
      loadOrders();
    } else {
      alert("Database error: " + (data.message || "Could not execute archive action step."));
    }
  } catch (e) {
    alert("Network delivery request error.");
  }
}

// Ignition
loadOrders();
// Core clock ticks loop to synchronize dashboard updates
setInterval(loadOrders, 5000);
</script>

</body>
</html>
